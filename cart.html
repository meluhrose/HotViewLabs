<header>

        </ul>

    <div class="header-icons">
        <a href="account/login.html"><img src="assets/user.png" alt="User profile icon for accessing account login and registration"></a>

    </div>
    <button class="hamburger" aria-label="Toggle menu">
        <span></span>

<body>
<main>
    <div class="cart-container">
        <div class="cart-item-header">

                <li>ITEM</li>

        </div>
        <div class="cart-summary">
            <div class="subtotal-container">
                <p>SUBTOTAL:</p> $<span id="total-amount">0.00</span>
            </div>
            <button class="checkout-btn cta" onclick="location.href='checkout.html'">CHECKOUT</button>

    </div>
